# Wave as a Flatpak. The GNOME runtime brings WebKitGTK (for the sign-in window) and Python.
app-id: app.wave.Wave
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: wave
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  # So Wave can install its own updates (a newer .flatpak) on request.
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: wave
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib && cp -r Wave /app/lib/wave
      - install -Dm755 wave.sh /app/bin/wave
      - install -Dm644 wave.png /app/share/icons/hicolor/512x512/apps/app.wave.Wave.png
      - install -Dm644 app.wave.Wave.desktop /app/share/applications/app.wave.Wave.desktop
      - install -Dm644 app.wave.Wave.metainfo.xml /app/share/metainfo/app.wave.Wave.metainfo.xml
    sources:
      - type: dir
        path: ../build/compose/binaries/main-release/app
      - type: file
        path: wave.sh
      - type: file
        path: ../icons/wave.png
      - type: file
        path: app.wave.Wave.desktop
      - type: file
        path: app.wave.Wave.metainfo.xml
