# Native Wave for Windows (WinUI 3): builds the app and its installer. On a v1.2.x release the
# installer is attached to it; run by hand, the installer is kept as a downloadable test build.
name: Windows native

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installer to (leave empty for a test build)
        required: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v1.2.')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        shell: bash
        run: |
          V="${TAG#v}"
          [ -z "$V" ] && V="1.2.0-dev.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "NUMERIC=${V%%-*}" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet publish windows/Wave.App/Wave.App.csproj -c Release -r win-x64 -p:Platform=x64 -p:Version=${{ env.NUMERIC }} -p:InformationalVersion=${{ env.VERSION }} -o windows/Wave.App/bin/publish
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=${{ env.VERSION }}" "/DSource=$PWD\windows\Wave.App\bin\publish" "/DOutDir=$PWD" windows\installer\wave.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Size
        shell: bash
        run: |
          du -sh windows/Wave.App/bin/publish Wave-*-windows-x64.exe
          echo "Resource indexes:"; find windows/Wave.App/bin windows/Wave.App/obj -iname "*.pri" | head -20
      - name: Attach to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "Wave-${VERSION}-windows-x64.exe" --clobber
      - name: Portable (unzip and run Wave.exe; nothing to install)
        if: env.TAG == ''
        shell: pwsh
        run: Compress-Archive -Path windows\Wave.App\bin\publish\* -DestinationPath "Wave-${{ env.VERSION }}-portable.zip"
      - name: Test build
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: Wave-${{ env.VERSION }}-windows-x64
          path: |
            Wave-*-windows-x64.exe
            Wave-*-portable.zip
