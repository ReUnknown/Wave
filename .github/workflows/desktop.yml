# Builds Wave for Windows (.exe) and Linux (.flatpak) and attaches them to the release.
# (The macOS .dmg and the Android APK are built on a Mac with desktop/package-macos.sh.)
name: Desktop builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (e.g. v1.1.0-beta.1)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Sign-in window (Edge WebView2)
        run: dotnet build desktop/signin/windows -c Release
      - name: Installer
        run: ./gradlew :desktop:packageReleaseExe --no-configuration-cache
        shell: bash
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          EXE=$(ls desktop/build/compose/binaries/main-release/exe/*.exe | head -1)
          cp "$EXE" "Wave-$VERSION-windows-x64.exe"
          gh release upload "$TAG" "Wave-$VERSION-windows-x64.exe" --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: App
        run: ./gradlew :desktop:createReleaseDistributable --no-configuration-cache
      - name: Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//47 org.gnome.Sdk//47
      - name: Flatpak
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir desktop/flatpak/app.wave.Wave.yml
          VERSION="${TAG#v}"
          flatpak build-bundle repo "Wave-$VERSION-linux-x64.flatpak" app.wave.Wave --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          gh release upload "$TAG" "Wave-$VERSION-linux-x64.flatpak" --clobber
